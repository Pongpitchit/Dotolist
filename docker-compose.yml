version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: tellro_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tellro
      POSTGRES_USER: tellro
      POSTGRES_PASSWORD: tellro_secret_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tellro"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: tellro_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://tellro:tellro_secret_2024@db:5432/tellro
      JWT_SECRET: tellro_jwt_super_secret_key_2024
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: tellro_web
    restart: unless-stopped
    environment:
      VITE_API_URL: ""
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
